name: RA v733 common DB sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ra-v733-common-db-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore monster drops and regenerate manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime

          restores = {
            'mon_branchling': [
              ('魔物素材','植物','mat_living_root','動く根','70%','1個'),
              ('採取素材','木材','mat_sturdy_branch','丈夫な枝','60%','1個'),
              ('魔物素材','植物','mat_branchling_sprout_core','若木の芽核','20%','1個'),
              ('魔物素材','植物','mat_branchling_young_bark','若木皮','45%','1個'),
            ],
            'mon_named_10': [
              ('魔物素材','植物','mat_living_root','動く根','70%','1個'),
              ('採取素材','木材','mat_sturdy_branch','丈夫な枝','60%','1個'),
              ('魔物素材','植物','mat_branchling_young_bark','若木皮','45%','1個'),
              ('魔物素材','植物','mat_named_10','枝冠の芽心','20%','1個'),
            ],
            'mon_mudhopper': [
              ('魔物素材','獣','mat_muddy_hide','泥まみれの皮','65%','1個'),
              ('採取素材','水・液体','mat_clear_water','澄んだ水','30%','1個'),
              ('魔物素材','獣','mat_mudhopper_jump_tendon','泥跳びの強腱','20%','1個'),
              ('魔物素材','獣','mat_mudhopper_skinfilm','泥跳び膜','45%','1個'),
            ],
            'mon_named_13': [
              ('魔物素材','獣','mat_muddy_hide','泥まみれの皮','65%','1個'),
              ('採取素材','水・液体','mat_clear_water','澄んだ水','30%','1個'),
              ('魔物素材','獣','mat_mudhopper_skinfilm','泥跳び膜','45%','1個'),
              ('魔物素材','獣','mat_named_13','泥跳の強靭腱','20%','1個'),
            ],
            'mon_mist_mosquito': [
              ('魔物素材','虫','mat_insect_wing','薄虫の羽','70%','1個'),
              ('魔物素材','獣','mat_small_claw','小さな爪','25%','1個'),
              ('魔物素材','虫','mat_mist_mosquito_mist_needle','霞蚊の霧針','20%','1個'),
            ],
            'mon_named_15': [
              ('魔物素材','虫','mat_insect_wing','薄虫の羽','70%','1個'),
              ('魔物素材','獣','mat_small_claw','小さな爪','25%','1個'),
              ('魔物素材','虫','mat_named_15','毒霧の濃針','20%','1個'),
            ],
            'mon_reed_lizard': [
              ('魔物素材','爬虫','mat_reed_lizard_scale','葦蜥蜴の水鱗','20%','1個'),
              ('採取素材','水・液体','mat_clear_water','澄んだ水','35%','1個'),
              ('魔物素材','獣','mat_small_beast_pelt','小獣の毛皮','35%','1個'),
              ('魔物素材','爬虫','mat_reed_lizard_tail_tendon','葦蜥蜴の尾腱','45%','1個'),
            ],
            'mon_named_17': [
              ('採取素材','水・液体','mat_clear_water','澄んだ水','35%','1個'),
              ('魔物素材','獣','mat_small_beast_pelt','小獣の毛皮','35%','1個'),
              ('魔物素材','爬虫','mat_reed_lizard_tail_tendon','葦蜥蜴の尾腱','45%','1個'),
              ('魔物素材','爬虫','mat_named_17','葦裂の水尾鱗','20%','1個'),
            ],
            'mon_pick_mole': [
              ('魔物素材','獣','mat_pick_mole_claw','削岩爪','75%','1個'),
              ('採取素材','鉱石','mat_iron_ore','鉄鉱石','55%','1個'),
              ('魔物素材','獣','mat_pick_mole_vibration_sac','掘爪獣の震動袋','20%','1個'),
              ('魔物素材','獣','mat_pickmole_hide','坑毛皮','45%','1個'),
            ],
            'mon_named_26': [
              ('魔物素材','獣','mat_pick_mole_claw','削岩爪','75%','1個'),
              ('採取素材','鉱石','mat_iron_ore','鉄鉱石','55%','1個'),
              ('魔物素材','獣','mat_pickmole_hide','坑毛皮','45%','1個'),
              ('魔物素材','獣','mat_named_26','鉱脈穿爪','20%','1個'),
            ],
          }

          def serial(rows):
              return '\n'.join('\t'.join(r) for r in rows)

          public = Path('data/public/recraft_alchemia_master.json')
          initial = Path('data/recraft_alchemia_initial_data.json')
          data = json.loads(public.read_text(encoding='utf-8'))
          byid = {m['id']: m for m in data['data']['monsters']}
          missing = sorted(set(restores)-set(byid))
          if missing:
              raise SystemExit(f'missing monsters: {missing}')
          for mid, rows in restores.items():
              byid[mid]['drops'] = serial(rows)
          data['version'] = 'v90.8.733'
          note = ' / v90.8.733: v90.8.709で★帯調整のため品目自体が差し替えられていた通常5体＋対応二つ名5体のドロップを、v90.8.704/705確定時の品目へ復元。確率は後続調整値を維持。'
          if note not in data.get('description',''):
              data['description'] = data.get('description','') + note
          text = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          public.write_text(text, encoding='utf-8')
          initial.write_text(text, encoding='utf-8')

          raw = text.encode('utf-8')
          sha = hashlib.sha256(raw).hexdigest()
          record_count = sum(len(v) for v in data['data'].values() if isinstance(v, list))
          jst = datetime.timezone(datetime.timedelta(hours=9))
          manifest = {
              'format':'recraft-alchemia-public-manifest',
              'version':'v90.8.733',
              'updatedAt':datetime.datetime.now(jst).replace(microsecond=0).isoformat(),
              'master':'recraft_alchemia_master.json',
              'sha256':sha,
              'bytes':len(raw),
              'recordCount':record_count,
              'dataKeys':list(data['data'].keys()),
              'files':{'master':{'file':'recraft_alchemia_master.json','sha256':sha,'bytes':len(raw)}}
          }
          Path('data/public/manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('version', data['version'])
          print('sha256', sha)
          print('bytes', len(raw))
          print('recordCount', record_count)
          PY
      - name: Commit synchronized DB
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/recraft_alchemia_master.json data/public/manifest.json data/recraft_alchemia_initial_data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix historical monster drops and sync common DB v90.8.733'
          git push
