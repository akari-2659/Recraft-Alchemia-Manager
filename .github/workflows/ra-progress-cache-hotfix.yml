name: RA progress common DB cache hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ra-progress-cache-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore browser cache for progress common DB
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('progress_manager.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("async function progressFetchJson(url,timeoutMs=12000){", "async function progressFetchJson(url,timeoutMs=12000,cacheMode='force-cache'){")
          s=s.replace("fetch(url,{cache:'no-store',signal:controller.signal})", "fetch(url,{cache:cacheMode,signal:controller.signal})")
          s=s.replace("      const token=`${Date.now()}_${attempt}_${Math.random().toString(36).slice(2)}`;\n      try{\n        const manifestUrl=new URL('manifest.json',base);\n        manifestUrl.searchParams.set('_ra',token);\n        const manifest=await progressFetchJson(manifestUrl.toString(),6000);", "      try{\n        const manifestUrl=new URL('manifest.json',base);\n        const manifest=await progressFetchJson(manifestUrl.toString(),6000,'no-cache');")
          s=s.replace("masterUrl.searchParams.set('_ra',`${info.sha256||String(manifest.version||'master')}_${token}`);", "masterUrl.searchParams.set('_ra',info.sha256||String(manifest.version||'master'));")
          s=s.replace("normalizeProgressMaster(await progressFetchJson(masterUrl.toString(),15000),manifest)", "normalizeProgressMaster(await progressFetchJson(masterUrl.toString(),15000,'force-cache'),manifest)")
          s=s.replace("directUrl.searchParams.set('_ra',`${Date.now()}_direct_${Math.random().toString(36).slice(2)}`);", "directUrl.searchParams.set('_ra','direct-cache');")
          s=s.replace("normalizeProgressMaster(await progressFetchJson(directUrl.toString(),15000),{master:'recraft_alchemia_master.json'})", "normalizeProgressMaster(await progressFetchJson(directUrl.toString(),15000,'force-cache'),{master:'recraft_alchemia_master.json'})")
          if "cache:'no-store'" in s or "Date.now()}_${attempt}" in s or "Date.now()}_direct" in s:
              raise SystemExit('cache-busting code remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add progress_manager.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore progress common DB browser caching'
          git push
